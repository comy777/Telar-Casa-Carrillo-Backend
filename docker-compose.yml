services:
  postgres:
    image: postgres:16-alpine
    container_name: telar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telar_casa_carrillo}
      POSTGRES_USER: ${POSTGRES_USER:-telar_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_local_password}
    ports:
      # Solo accesible desde este equipo, no desde la red local.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telar_app} -d ${POSTGRES_DB:-telar_casa_carrillo}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
